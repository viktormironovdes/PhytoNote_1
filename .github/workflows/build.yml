name: Build PhytoNote APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'                        # ← БЫЛО 17, СТАЛО 21

    - name: Create Capacitor project
      run: |
        echo '{
          "name": "PhytoNote",
          "version": "1.0.0",
          "scripts": {
            "build": "echo \"Building PhytoNote...\""
          },
          "dependencies": {
            "@capacitor/filesystem": "^8.0.0",
            "@capgo/capacitor-file-sharer": "^8.0.0"
          },
          "devDependencies": {
            "@capacitor/cli": "^8.0.0",
            "@capacitor/android": "^8.0.0"
          }
        }' > package.json

    - name: Install dependencies
      run: npm install

    - name: Copy web assets
      run: |
        mkdir -p www
        cp -r assets/* www/
        echo "✅ All files copied to www!"

    - name: Initialize Capacitor and add Android
      run: |
        npx cap init "PhytoNote" "com.phytonote.app" --web-dir www
        npx cap add android
        npx cap update
        npx cap sync

    - name: Setup app icons
      run: |
        echo "🎨 Setting up app icons..."
        
        mkdir -p android/app/src/main/res/mipmap-mdpi
        mkdir -p android/app/src/main/res/mipmap-hdpi
        mkdir -p android/app/src/main/res/mipmap-xhdpi
        mkdir -p android/app/src/main/res/mipmap-xxhdpi
        mkdir -p android/app/src/main/res/mipmap-xxxhdpi
        
        ICON_PATH="assets/phytonote/icons"
        
        if [ -d "$ICON_PATH" ]; then
          echo "📂 Found icons in: $ICON_PATH"
          
          [ -f "$ICON_PATH/icon-48.png" ] && cp "$ICON_PATH/icon-48.png" android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          [ -f "$ICON_PATH/icon-72.png" ] && cp "$ICON_PATH/icon-72.png" android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          [ -f "$ICON_PATH/icon-96.png" ] && cp "$ICON_PATH/icon-96.png" android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          [ -f "$ICON_PATH/icon-144.png" ] && cp "$ICON_PATH/icon-144.png" android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          [ -f "$ICON_PATH/icon-192.png" ] && cp "$ICON_PATH/icon-192.png" android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          
          [ -f "$ICON_PATH/icon-48.png" ] && cp "$ICON_PATH/icon-48.png" android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          [ -f "$ICON_PATH/icon-72.png" ] && cp "$ICON_PATH/icon-72.png" android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          [ -f "$ICON_PATH/icon-96.png" ] && cp "$ICON_PATH/icon-96.png" android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          [ -f "$ICON_PATH/icon-144.png" ] && cp "$ICON_PATH/icon-144.png" android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          [ -f "$ICON_PATH/icon-192.png" ] && cp "$ICON_PATH/icon-192.png" android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          
          echo "✅ Icons installed!"
        fi

    - name: Add storage permissions to AndroidManifest.xml
      run: |
        MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
        if [ -f "$MANIFEST_PATH" ]; then
          echo "📝 Adding storage permissions to AndroidManifest.xml..."
          
          if ! grep -q "WRITE_EXTERNAL_STORAGE" "$MANIFEST_PATH"; then
            sed -i '/<manifest/a \    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />' "$MANIFEST_PATH"
          fi
          
          if ! grep -q "READ_EXTERNAL_STORAGE" "$MANIFEST_PATH"; then
            sed -i '/<manifest/a \    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />' "$MANIFEST_PATH"
          fi
          
          if ! grep -q "READ_MEDIA_IMAGES" "$MANIFEST_PATH"; then
            sed -i '/<manifest/a \    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />' "$MANIFEST_PATH"
          fi
          
          if ! grep -q "READ_MEDIA_AUDIO" "$MANIFEST_PATH"; then
            sed -i '/<manifest/a \    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />' "$MANIFEST_PATH"
          fi
          
          if ! grep -q "READ_MEDIA_VIDEO" "$MANIFEST_PATH"; then
            sed -i '/<manifest/a \    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />' "$MANIFEST_PATH"
          fi
          
          echo "✅ All permissions added to AndroidManifest.xml"
        fi

    - name: Create keystore in correct location
      run: |
        echo "🔐 Creating keystore..."
        keytool -genkey -v \
          -keystore phytonote.keystore \
          -alias phytonote \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -storepass phytonote123 \
          -keypass phytonote123 \
          -dname "CN=PhytoNote, OU=App, O=PhytoNote, L=City, S=State, C=US"
        echo "✅ Keystore created at: $(pwd)/phytonote.keystore"
        ls -la phytonote.keystore

    - name: Fix build.gradle with correct configuration
      run: |
        GRADLE_PATH="android/app/build.gradle"
        
        echo "📝 Overwriting build.gradle with correct configuration..."
        
        cat > $GRADLE_PATH << 'EOF'
        apply plugin: 'com.android.application'

        android {
            namespace "com.phytonote.app"
            compileSdkVersion 34
            defaultConfig {
                applicationId "com.phytonote.app"
                minSdkVersion 23
                targetSdkVersion 34
                versionCode 1
                versionName "1.0.0"
                testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
            }
            signingConfigs {
                release {
                    storeFile file("../../phytonote.keystore")
                    storePassword "phytonote123"
                    keyAlias "phytonote"
                    keyPassword "phytonote123"
                }
            }
            buildTypes {
                release {
                    signingConfig signingConfigs.release
                    minifyEnabled false
                    proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
                }
            }
            
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_21
                targetCompatibility JavaVersion.VERSION_21
            }
        }

        repositories {
            flatDir {
                dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
            }
        }

        dependencies {
            implementation fileTree(include: ['*.jar'], dir: 'libs')
            implementation "androidx.appcompat:appcompat:1.6.1"
            implementation "com.google.android.material:material:1.9.0"
            implementation "androidx.constraintlayout:constraintlayout:2.1.4"
            implementation "androidx.core:core-splashscreen:1.0.1"
            implementation project(':capacitor-android')
            implementation project(':capacitor-cordova-android-plugins')
        }

        apply from: 'capacitor.build.gradle'
        EOF
        
        echo "✅ build.gradle overwritten successfully!"

    - name: Update versionCode in build.gradle
      run: |
        GRADLE_PATH="android/app/build.gradle"
        if [ -f "$GRADLE_PATH" ]; then
          CURRENT_VERSION=$(grep -o 'versionCode [0-9]*' "$GRADLE_PATH" | awk '{print $2}')
          if [ -z "$CURRENT_VERSION" ]; then
            CURRENT_VERSION=1
          fi
          NEW_VERSION=$((CURRENT_VERSION + 1))
          sed -i "s/versionCode [0-9]*/versionCode $NEW_VERSION/" "$GRADLE_PATH"
          echo "✅ Version updated: versionCode=$NEW_VERSION"
        fi

    - name: Build Release APK
      run: |
        cd android
        chmod +x ./gradlew
        ./gradlew assembleRelease

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: phytonote-apk
        path: android/app/build/outputs/apk/release/app-release.apk
        retention-days: 7

    - name: Upload keystore backup
      uses: actions/upload-artifact@v4
      with:
        name: phytonote-keystore-backup
        path: phytonote.keystore
        retention-days: 7
